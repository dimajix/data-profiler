[project]
name = "data-profiler"
version = "0.1.0"
description = "Profiles the tables of an SQL database to help build an understandable data model of it."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["simulation"]

[tool.uv.workspace]
members = ["simulation"]

[tool.uv.sources]
simulation = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
