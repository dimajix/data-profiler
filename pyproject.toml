[project]
name = "data-profiler"
version = "0.1.0"
description = "Profiles the tables of an SQL database to help build an understandable data model of it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "simulation",
]

[tool.uv.workspace]
members = ["simulation"]

[tool.uv.sources]
simulation = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "RUF",
    # The rules of docs/CODING-GUIDELINES.md a lint checks, by their sections there:
    "D",        # Comments and documentation: module docs and doc comments
    "PLC0415",  # Imports: at the top of the module
    "TID252",   # Imports: absolute, never relative
    "SLF001",   # Visibility: a name with an underscore stays in its class
    "T20",      # Logging: never by printing
    "BLE001",   # Error handling: no exception caught without telling it apart
    "S110",     # Error handling: no exception dropped
    "S112",     # Error handling: no exception dropped
    "TID251",   # the APIs banned below, each by the rule that bans it
    "C901",     # Checks: functions that do more than one thing are split - by their branches
    "PLR0915",  # Checks: functions that do more than one thing are split - by their length
    "PGH004",   # Checks: a lint is silenced by its code
]
ignore = [
    "SIM105",   # proposes `contextlib.suppress`, which drops an exception as S110 forbids
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D103"]  # Testing: the functions of a test module need no docstring

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Protocol".msg = "Interfaces between parts are abstract classes (abc.ABC)."
"sys.exit".msg = "Only cli ends the program."
"sys.stdout".msg = "Nothing is printed: log through logging."
"sys.stderr".msg = "Nothing is printed: log through logging."
"logging.basicConfig".msg = "Only cli configures where logs go."
"logging.config".msg = "Only cli configures where logs go."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
enable_error_code = ["ignore-without-code"]
files = ["src", "simulation/src", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
