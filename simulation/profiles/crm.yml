# An example profile in the manner of a CRM: customers, their addresses and contacts, products,
# orders and their items, under the abbreviated names such a system has; its texts of a semantic
# type have their match, by which they are generated. It is loaded into the simulation environment
# by `uv run simulation load simulation/profiles/crm.yml`.
format: 2
catalog: crm
schema: sales
tables:
