format: '14.5'
name: prod
rows: 350
columns:
- name: prod_id
  type: bigint
  statistics:
    nulls: 0
    distinct: 350
    range: {smallest: '100001', largest: '100350'}
- name: prod_cd
  type: varchar(8)
  statistics: {nulls: 0, distinct: 350, lengths: {shortest: 8, longest: 8}}
- name: ean_cd
  type: varchar(13)
  statistics:
    nulls: 0
    distinct: 300
    lengths: {shortest: 13, longest: 13}
    sentinels: [{value: '', rows: 50}]
- name: prod_nm
  type: varchar(80)
  statistics: {nulls: 0, distinct: 348, lengths: {shortest: 6, longest: 48}}
- name: prod_grp_cd
  type: varchar(4)
  statistics: {nulls: 0, distinct: 14, lengths: {shortest: 2, longest: 4}}
- {name: lst_prc_amt, type: "decimal(10,2)", statistics: {nulls: 0, distinct: 290}}
- name: prc_curr_no
  type: varchar(3)
  statistics: {nulls: 0, distinct: 4, lengths: {shortest: 3, longest: 3}}
  matches: [{type: currency-number, sample: 1.0, table: 1.0}]
- name: orgn_ctry_no
  type: varchar(3)
  statistics: {nulls: 0, distinct: 10, lengths: {shortest: 3, longest: 3}}
