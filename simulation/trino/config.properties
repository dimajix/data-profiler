# The simulated Trino: one node, reached as Starburst is, by HTTPS with a password. Plain HTTP stays
# open inside the container, unpublished, where the node reaches itself by `discovery.uri`.
#
# The key and certificate in tls/ are made for the simulation alone: for `localhost`, not a CA, so
# that trusting them trusts nothing else, with the extensions strict verification asks for - key
# usage, extended key usage `serverAuth`, subject and authority key identifiers. password.db holds
# bcrypt hashes of cost 10 in the form `$2y$`, as `htpasswd -B -C 10` writes them.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=simulation-only
