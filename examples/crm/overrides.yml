# What is given by hand of the profiles of the example project, the same for all its environments:
# what the database and one of its tables hold, concepts of the glossary - a customer; an address,
# written in two ways; a prefix that marks a custom column, left out of the names; a contact person,
# written as that prefix is; the terms of three names that stand for the one or the other; and an
# IBAN, written as its word alone -, the readings of those three names, a name given in place of the
# one composed from a reading and a description in place of the one proposed, the sensitivity of a
# column the detectors miss - here the names of persons, which no detector recognises -, the
# sentinels of a column in place of those of the tool - here the postal codes of a delivery, which
# are empty where none is given, or would be zeros -, the primary key of the items of an order, the
# order and the position in place of the identifier chosen, the references of two columns of whole
# numbers, which keys numbered from one hold as candidates - the contact person of a customer and
# the customer of an order -, and none of the number a business partner has as a customer elsewhere,
# and the discriminator of the business partners, its entities named by one value each, which the
# others it is found of join, and described.
format: "7.3"
description: >-
  The CRM of a wholesaler of office supplies: its customers, mostly companies, their contacts and
  addresses, the products it sells, and the orders of its customers.
glossary:
  customer:
    abbreviations: [cust]
    description: A person or company that buys from the company, with its orders and addresses.
  address:
    abbreviations: [addr, adr]
    description: Where a person or company is reached, by post or by e-mail.
  airplus:
    abbreviations: [ap]
    description: >-
      Marks a column added to the CRM for AirPlus, a custom column; it says nothing of what the
      column holds.
    omitted: true
  contact_person:
    abbreviations: [ap]
    description: The person a customer is reached through, one of its contacts.
  identifier:
    abbreviations: [id]
  name:
    abbreviations: [nm]
  segment:
    abbreviations: [seg]
  code:
    abbreviations: [cd]
  iban: {}
tables:
  cust:
    columns:
      cust_nm: {sensitivity: personal}
      cust_ap_id:
        reading: [customer, contact_person, identifier]
        name: contact_person_id
        description: The identifier of the contact person a customer is reached through.
        reference: {table: cntct, column: cntct_id}
      ap_ap_nm: {sensitivity: personal, reading: [airplus, contact_person, name]}
      ap_seg_cd: {reading: [airplus, segment, code]}
  cntct:
    columns:
      frst_nm: {sensitivity: personal}
      lst_nm: {sensitivity: personal}
  ord:
    columns:
      cust_id: {reference: {table: cust, column: cust_id}}
      dlvr_pst_cd: {sentinels: ["", "00000"]}
  ord_itm:
    description: The positions of an order, one product each, with its quantity and price.
    primary_key: [ord_id, pos_no]
  prtnr:
    columns:
      cust_no: {reference: false}
    discriminator:
      column: prtnr_typ_cd
      entities:
        customer:
          values: [K]
          description: A company that buys from the company, with its credit limit and terms.
        supplier:
          values: [L]
          description: A company the company buys from, paid to its bank account.
        prospect: {values: [I]}
        employee: {values: [M]}
