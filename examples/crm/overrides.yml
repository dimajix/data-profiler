# What is given by hand of the profiles of the example project, the same for all its environments:
# concepts of the glossary - a customer; an address, written in two ways; and a prefix that marks a
# custom column, left out of the names -, the sensitivity of a column the detectors miss - here the
# names of persons, which no detector recognises -, and the sentinels of a column in place of those
# of the tool - here the postal codes of a delivery, which are empty where none is given, or would
# be zeros.
format: 3
glossary:
  customer:
    abbreviations: [cust]
    description: A person or company that buys from the company, with its orders and addresses.
  address:
    abbreviations: [addr, adr]
    description: Where a person or company is reached, by post or by e-mail.
  airplus:
    abbreviations: [ap]
    description: >-
      Marks a column added to the CRM for AirPlus, a custom column; it says nothing of what the
      column holds.
    omitted: true
tables:
  cust:
    columns:
      cust_nm: {sensitivity: personal}
  cntct:
    columns:
      frst_nm: {sensitivity: personal}
      lst_nm: {sensitivity: personal}
  ord:
    columns:
      dlvr_pst_cd: {sentinels: ["", "00000"]}
