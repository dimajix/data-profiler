# What is given by hand of the profiles of the example project, the same for all its environments:
# concepts of the glossary - a customer; an address, written in two ways; a prefix that marks a
# custom column, left out of the names; a contact person, written as that prefix is; the terms of
# three names that stand for the one or the other; and an IBAN, written as its word alone -, the
# readings of those three names, a name given in place of the one composed from a reading and a
# description in place of the one proposed, the sensitivity of a column the detectors miss - here
# the names of persons, which no detector recognises -, and the sentinels of a column in place of
# those of the tool - here the postal codes of a delivery, which are empty where none is given, or
# would be zeros.
format: 6
glossary:
  customer:
    abbreviations: [cust]
    description: A person or company that buys from the company, with its orders and addresses.
  address:
    abbreviations: [addr, adr]
    description: Where a person or company is reached, by post or by e-mail.
  airplus:
    abbreviations: [ap]
    description: >-
      Marks a column added to the CRM for AirPlus, a custom column; it says nothing of what the
      column holds.
    omitted: true
  contact_person:
    abbreviations: [ap]
    description: The person a customer is reached through, one of its contacts.
  identifier:
    abbreviations: [id]
  name:
    abbreviations: [nm]
  segment:
    abbreviations: [seg]
  code:
    abbreviations: [cd]
  iban: {}
tables:
  cust:
    columns:
      cust_nm: {sensitivity: personal}
      cust_ap_id:
        reading: [customer, contact_person, identifier]
        name: contact_person_id
        description: The identifier of the contact person a customer is reached through.
      ap_ap_nm: {sensitivity: personal, reading: [airplus, contact_person, name]}
      ap_seg_cd: {reading: [airplus, segment, code]}
  cntct:
    columns:
      frst_nm: {sensitivity: personal}
      lst_nm: {sensitivity: personal}
  ord:
    columns:
      dlvr_pst_cd: {sentinels: ["", "00000"]}
